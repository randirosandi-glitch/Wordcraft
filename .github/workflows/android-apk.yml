name: Build WordCraft Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: wordcraft-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build WordCraft from ArtCraft Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_DEBUG: "false"

    steps:
      - name: Check out WordCraft build configuration
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Check out ArtCraft Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: artcraft-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ArtCraft build dependencies
        run: python -m pip install --upgrade Pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure JDK for ArtCraft
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build WordCraft using ArtCraft's native Android integration
        shell: bash
        working-directory: artcraft-android
        env:
          BUILD_SOURCE: stable
        run: |
          set -euo pipefail
          # Use ArtCraft's own pinned vendor patches, WordCraft launcher generation,
          # SAF bridge, IME bridge, modifier-key handling and Android input integration.
          # Do not overlay a different Winit/egui fork or apply local compatibility patches.
          bash build.sh -wordcraft -stable -packagename=ai.storyteller.wordcraft
          apk="$(find output -maxdepth 1 -type f -name 'wordcraft-*.apk' -print | sort -V | tail -n 1)"
          test -n "$apk"
          install -D "$apk" "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"

      - name: Verify APK signature, package and architecture
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='ai.storyteller.wordcraft'"
          echo "$badging" | grep -F "arm64-v8a"
          unzip -tq "$apk"

      - name: Upload WordCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-artcraft-android-arm64
          path: wordcraft-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
