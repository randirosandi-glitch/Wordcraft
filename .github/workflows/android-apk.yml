name: Build WordCraft Android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wordcraft-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build WordCraft from ArtCraft Android
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_DEBUG: "false"

    steps:
      - name: Check out WordCraft build configuration
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Check out ArtCraft Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: 52308fbcb26d8d8625f35fc1f048813f8e1e12a8
          path: artcraft-android

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify upstream Android input and gesture integration
        shell: bash
        working-directory: artcraft-android
        run: |
          set -euo pipefail
          grep -q 'fn recognise_touch_gesture(' vendor/winit/src/platform_impl/android/mod.rs
          grep -q 'GestureStep::Pan' vendor/winit/src/platform_impl/android/mod.rs
          grep -q 'update_modifiers(key.meta_state(), callback);' vendor/winit/src/platform_impl/android/mod.rs
          grep -q 'android_app.enable_motion_axis(Axis::Vscroll);' vendor/winit/src/platform_impl/android/mod.rs
          grep -q 'bash "$ROOT/lib/scrolling.sh" "$SRC" "$APP" "$TITLE"' lib/build-common.sh
          grep -q 'reset_ime_with_request' lib/build-common.sh
          grep -q 'ImeResetCompleted' vendor/winit/src/event.rs
          grep -q 'ImeResetCompleted' vendor/egui-winit/src/lib.rs
          grep -q 'ObservableEditable' templates/android/SafActivity.java
          grep -q 'isFromSoftKeyboard(KeyEvent event)' templates/android/SafActivity.java

      - name: Check out the exact WordCraft release source
        shell: bash
        working-directory: artcraft-android
        run: |
          set -euo pipefail
          mkdir -p source
          git clone --depth 1 --branch v0.15.0 https://github.com/storytold/wordcraft.git source/wordcraft
          expected="b47079fc791595fd84bb499d64dcd3f0624ef35a"
          actual="$(git -C source/wordcraft rev-parse HEAD)"
          test "$actual" = "$expected"
          python3 -m py_compile "$GITHUB_WORKSPACE/workspace/scripts/patch_wordcraft_android.py"
          python3 "$GITHUB_WORKSPACE/workspace/scripts/patch_wordcraft_android.py" \
            "$GITHUB_WORKSPACE/artcraft-android" \
            "$GITHUB_WORKSPACE/artcraft-android/source/wordcraft"
          git -C source/wordcraft diff --check
          git diff --check
          echo "Verified WordCraft source commit: $actual"

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure JDK for ArtCraft
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Set up Rust ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install ArtCraft build dependency
        run: python -m pip install --upgrade Pillow

      - name: Prepare transparent WordCraft launcher icon
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode workspace/assets/wordcraft-icon.webp.base64 > workspace/assets/wordcraft-icon.webp
          python - <<'PY'
          from PIL import Image
          icon = Image.open("workspace/assets/wordcraft-icon.webp").convert("RGBA")
          if icon.size != (192, 192) or icon.getpixel((0, 0))[3] != 0:
              raise SystemExit("WordCraft icon is invalid or its corners are not transparent")
          print(f"Verified transparent WordCraft icon: {icon.size}")
          PY

      - name: Build WordCraft Android APK
        shell: bash
        working-directory: artcraft-android
        run: |
          set -euo pipefail
          # The source is pinned and patched above. ArtCraft supplies the native Android
          # launcher, keyboard/modifier adapter, IME bridge, SAF picker and signed APK packaging.
          if bash build.sh -wordcraft -tag=v0.15.0 -packagename=ai.storyteller.wordcraft -appicon="$GITHUB_WORKSPACE/workspace/assets/wordcraft-icon.webp"; then
            build_status=0
          else
            build_status=$?
          fi

          generated="source/wordcraft/apps/wordcraft-android/src/lib.rs"
          test -f "$generated"
          grep -F 'self.inner.raw_input_hook(ctx, raw);' "$generated"
          grep -F 'self.inner.request_ime_hide' "$generated"
          grep -F 'apply_android_modifiers(&mut self.modifiers, raw);' "$generated"
          grep -F 'self.handle_clipboard_shortcuts(raw);' "$generated"
          grep -F 'ACTION_OPEN_DOCUMENT' templates/android/SafActivity.java
          grep -F 'ACTION_CREATE_DOCUMENT' templates/android/SafActivity.java
          grep -F 'ObservableEditable' templates/android/SafActivity.java
          grep -F 'isFromSoftKeyboard(KeyEvent event)' templates/android/SafActivity.java

          if (( build_status != 0 )); then
            exit "$build_status"
          fi

          apk="$(find output -maxdepth 1 -type f -name 'wordcraft-*.apk' -print | sort -V | tail -n 1)"
          test -n "$apk"
          install -D "$apk" "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"

      - name: Verify signature, alignment, package ID and ARM64
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='ai.storyteller.wordcraft'"
          echo "$badging" | grep -F "arm64-v8a"
          unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/libwordcraft_android.so"
          unzip -tq "$apk"
          sha256sum "$apk"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-artcraft-android-arm64
          path: wordcraft-android-arm64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-build-logs
          path: artcraft-android/logs/
          if-no-files-found: warn
          retention-days: 14
