name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this enhancement workspace
        uses: actions/checkout@v4
        with:
          path: enhancement

      - name: Check out ArtCraft Android integration
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: artcraft-android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ArtCraft build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build WordCraft with ArtCraft Android SAF integration
        shell: bash
        run: |
          set -euo pipefail
          cd artcraft-android
          # Keep the existing Android application ID so this remains the same app identity.
          # CI signs with a fresh temporary key; uninstall the previous CI-signed build before installing.
          bash build.sh -wordcraft -packagename=ai.storyteller.wordcraft
          apk="$(find output -maxdepth 1 -type f -name 'wordcraft-*.apk' -print | sort | tail -n 1)"
          test -n "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"

      - name: Verify APK package and native architecture
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='ai.storyteller.wordcraft'|native-code:.*arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-saf
          path: wordcraft-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
