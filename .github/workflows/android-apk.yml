name: Build WordCraft Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: wordcraft-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build WordCraft from ArtCraft Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTC_WRAPPER: ""
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_DEBUG: "false"

    steps:
      - name: Check out WordCraft build configuration
        uses: actions/checkout@v4
        with:
          path: workspace

      - name: Check out ArtCraft Android builder
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: artcraft-android

      - name: Align ArtCraft Winit with WordCraft egui 0.37
        shell: bash
        working-directory: artcraft-android
        run: |
          set -euo pipefail

          # WordCraft's pinned egui 0.37 fork requires the matching Winit fork.
          # ArtCraft's stock Winit is 0.30.13 without the ordered IME-reset API.
          tmp="$(mktemp -d)"
          git clone --filter=blob:none https://github.com/storytold/winit.git "$tmp/winit"
          git -C "$tmp/winit" checkout --detach a517b3846ee8457d84ee4975110bfda6797c44dc
          test "$(git -C "$tmp/winit" rev-parse HEAD)" = "a517b3846ee8457d84ee4975110bfda6797c44dc"
          rm -rf vendor/winit
          cp -a "$tmp/winit" vendor/winit
          rm -rf "$tmp"

          # The builder's Android clipboard bridge is retained. Its egui-winit 0.36
          # adapter must explicitly ignore the new Winit IME-reset fence event.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vendor/egui-winit/src/lib.rs")
          s = p.read_text()
          old = '''            WindowEvent::ActivationTokenDone { .. }
                      | WindowEvent::AxisMotion { .. }
                      | WindowEvent::DoubleTapGesture { .. } => EventResponse {'''
          new = '''            WindowEvent::ActivationTokenDone { .. }
                      | WindowEvent::AxisMotion { .. }
                      | WindowEvent::DoubleTapGesture { .. }
                      | WindowEvent::ImeResetCompleted { .. } => EventResponse {'''
          if s.count(old) != 1:
              raise SystemExit("Expected egui-winit ignore-event match was not found exactly once")
          s = s.replace(old, new, 1)
          old = '''        WindowEvent::PanGesture { .. } => "WindowEvent::PanGesture",
          }'''
          new = '''        WindowEvent::PanGesture { .. } => "WindowEvent::PanGesture",
              WindowEvent::ImeResetCompleted { .. } => "WindowEvent::ImeResetCompleted",
          }'''
          if s.count(old) != 1:
              raise SystemExit("Expected egui-winit event-description match was not found exactly once")
          p.write_text(s.replace(old, new, 1))
          PY

          # The old two-finger-scroll source patch targets a pre-refactor WordApp
          # initializer and adds a field that current WordCraft no longer initializes.
          # Skip that optional gesture patch for WordCraft; physical keyboard and SAF
          # integrations remain enabled.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/build-common.sh")
          s = p.read_text()
          old = 'bash "$ROOT/lib/scrolling.sh" "$SRC" "$APP" "$TITLE"'
          new = 'if [[ "$APP" != "wordcraft" ]]; then\n    bash "$ROOT/lib/scrolling.sh" "$SRC" "$APP" "$TITLE"\nfi'
          if s.count(old) != 1:
              raise SystemExit("Expected scrolling hook was not found exactly once")
          p.write_text(s.replace(old, new, 1))
          PY

          # Fail early if any of the required compatibility symbols are absent.
          grep -q 'ImeResetCompleted' vendor/winit/src/event.rs
          grep -q 'reset_ime_with_request' vendor/winit/src/window.rs
          grep -q 'ImeResetCompleted' vendor/egui-winit/src/lib.rs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ArtCraft build dependencies
        run: python -m pip install --upgrade Pillow

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure JDK for ArtCraft
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Build WordCraft using ArtCraft's native Android integration
        shell: bash
        working-directory: artcraft-android
        env:
          BUILD_SOURCE: stable
        run: |
          set -euo pipefail
          # Use ArtCraft's own pinned vendor patches, WordCraft launcher generation,
          # SAF bridge, IME bridge, modifier-key handling and Android input integration.
          # Do not overlay a different Winit/egui fork or apply local compatibility patches.
          bash build.sh -wordcraft -stable -packagename=ai.storyteller.wordcraft
          apk="$(find output -maxdepth 1 -type f -name 'wordcraft-*.apk' -print | sort -V | tail -n 1)"
          test -n "$apk"
          install -D "$apk" "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"

      - name: Verify APK signature, package and architecture
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='ai.storyteller.wordcraft'"
          echo "$badging" | grep -F "arm64-v8a"
          unzip -tq "$apk"

      - name: Upload WordCraft APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-artcraft-android-arm64
          path: wordcraft-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
