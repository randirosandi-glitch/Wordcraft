name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "README.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out this enhancement workspace
        uses: actions/checkout@v4
        with:
          path: enhancement

      - name: Check out ArtCraft Android integration
        uses: actions/checkout@v4
        with:
          repository: MostafaXS1/artcraft-android
          ref: fbb4f66fcc868afdd8303d5227aa81db6a21d7fa
          path: artcraft-android

      - name: Check out the egui-compatible Winit fork
        uses: actions/checkout@v4
        with:
          repository: storytold/winit
          ref: a517b3846ee8457d84ee4975110bfda6797c44dc
          path: winit-fork

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ArtCraft build dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          ndk="$ANDROID_HOME/ndk/27.2.12479018"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"
          echo "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Align Winit with the egui IME API
        shell: bash
        run: |
          set -euo pipefail
          # egui commit 6d518fc requires the matching Storytold Winit fork.
          # Use the complete matching Winit fork, including its Android backend.
          # The ArtCraft Android backend predates the IME reset API required by egui.
          rm -rf artcraft-android/vendor/winit
          mkdir -p artcraft-android/vendor/winit
          cp -a winit-fork/. artcraft-android/vendor/winit/
          rm -rf artcraft-android/vendor/winit/.git
          grep -q 'ImeResetCompleted' artcraft-android/vendor/winit/src/event.rs
          grep -q 'reset_ime_with_request' artcraft-android/vendor/winit/src/window.rs
          grep -q 'reset_ime_with_request' artcraft-android/vendor/winit/src/platform_impl/android/mod.rs

      - name: Patch Android compatibility against WordCraft 0.15
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # ArtCraft's WordCraft scrolling patch adds an app-wide IME-hide flag.
          # Add its constructor and exhaustive app-wide destructuring to WordCraft 0.15.
          p = Path("artcraft-android/lib/scrolling.sh")
          s = p.read_text()
          marker = "\nif fixed:\n"
          addition = '''
          if app == "wordcraft":
              if fix(
                  "crates/ui-egui/src/app.rs",
                  "            comment_drafts: Default::default(),\n",
                  "            comment_drafts: Default::default(),\n            request_ime_hide: false,\n",
              ):
                  fixed.append("crates/ui-egui/src/app.rs (initialize keyboard-hide request)")
              if fix(
                  "crates/ui-egui/src/window_ui.rs",
                  "            comment_drafts: _,\n",
                  "            comment_drafts: _,\n            request_ime_hide: _,\n",
              ):
                  fixed.append("crates/ui-egui/src/window_ui.rs (classify keyboard-hide request)")
          '''
          if "initialize keyboard-hide request" not in s:
              if s.count(marker) != 1:
                  raise SystemExit("Could not locate the final ArtCraft scrolling-patch output block")
              s = s.replace(marker, "\n" + addition + marker, 1)
              p.write_text(s)

          # The Android-specific egui-winit fork predates the matching Winit IME event.
          p = Path("artcraft-android/vendor/egui-winit/src/lib.rs")
          s = p.read_text()
          ignored = "            WindowEvent::ActivationTokenDone { .. }\n"
          if "WindowEvent::ImeResetCompleted { .. }" not in s:
              if s.count(ignored) != 1:
                  raise SystemExit("Could not locate egui-winit ignored-window-event arm")
              s = s.replace(ignored, ignored + "            | WindowEvent::ImeResetCompleted { .. }\n", 1)
              desc = '        WindowEvent::PanGesture { .. } => "WindowEvent::PanGesture",\n'
              if s.count(desc) != 1:
                  raise SystemExit("Could not locate egui-winit event-description arm")
              s = s.replace(desc, desc + '        WindowEvent::ImeResetCompleted { .. } => "WindowEvent::ImeResetCompleted",\n', 1)
              p.write_text(s)
          PY

      - name: Build WordCraft with ArtCraft Android SAF integration
        shell: bash
        run: |
          set -euo pipefail
          cd artcraft-android
          # Keep the existing Android application ID so this remains the same app identity.
          # CI signs with a fresh temporary key; uninstall the previous CI-signed build before installing.
          bash build.sh -wordcraft -packagename=ai.storyteller.wordcraft
          apk="$(find output -maxdepth 1 -type f -name 'wordcraft-*.apk' -print | sort | tail -n 1)"
          test -n "$apk"
          cp "$apk" "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          sha256sum "$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"

      - name: Verify APK package and native architecture
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/wordcraft-android-arm64.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -E "package: name='ai.storyteller.wordcraft'|native-code:.*arm64-v8a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wordcraft-android-arm64-saf
          path: wordcraft-android-arm64.apk
          if-no-files-found: error
          retention-days: 14
